<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="home-styles.css" />
    <title>Home Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=National+Park:wght@200..800&display=swap" rel="stylesheet">
  </head>

  <body>
    <div class="home-container">
      <!-- <h1 class="cedarville-cursive-regular">i love you mosttt bubby <3 </h1> -->
      <h1 class="cedarville-cursive-regular">RAWRRR</h1>
      <h3 class="cedarville-cursive-regular">click around!!</h1>
      <div class="apps">
        <div class="app-slot">
          <!-- <span class="app">calendar</span> -->
          <div id="countdown">
            <span id="days-left"></span> <span id="date-text" class="cedarville-cursive-regular">days until 2 years!!!</span>
          </div>
        </div>

        <div class="app-slot">
          <span id="letters" class="cedarville-cursive-regular">letters</span>
        </div>

        <div class="app-slot">
          <span id="gallery" class="cedarville-cursive-regular">gallery</span>
        </div>

        <div class="app-slot">
          <span id="game" class="cedarville-cursive-regular">game</span>
        </div>

        <div class="app-slot">
          <span id="puzzle" class="cedarville-cursive-regular">puzzle</span>
        </div>

        <div class="app-slot">
          <span id="music" class="cedarville-cursive-regular">music</span>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
